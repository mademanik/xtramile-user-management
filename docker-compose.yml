services:
  xtramile-app:
    build:
      context: ./php-api
      dockerfile: Dockerfile
    container_name: xtramile-app
    ports:
      - "8080:8080"
    volumes:
      - ./php-api:/var/www
    working_dir: /var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=xtramile-db
      - DB_PORT=3306
      - DB_DATABASE=xtramile_db
      - DB_USERNAME=xtramile
      - DB_PASSWORD=xtramile
    depends_on:
      - xtramile-db
    command: sh -c "sleep 10 && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8080"

  python-api:
    build:
      context: ./python-api
    container_name: python-api
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      
  go-scheduler-service:
    build:
      context: ./go-scheduler-service
    container_name: go-scheduler-service
    depends_on:
      - xtramile-app
      - python-api
    environment:
      - PHP_API_URL=http://xtramile-app:8080/api/users
      - PYTHON_API_URL=http://python-api:5000/receive
    volumes:
      - ./go-scheduler-service/output:/app/data
    working_dir: /app

  xtramile-db:
    image: mysql:8.0
    container_name: xtramile-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=xtramile_db
      - MYSQL_USER=xtramile
      - MYSQL_PASSWORD=xtramile
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"